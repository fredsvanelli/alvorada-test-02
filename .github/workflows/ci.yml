name: CI

on:
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        # Same credentials as api/.env.example, which the job copies to api/.env.
        env:
          POSTGRES_USER: bookings
          POSTGRES_PASSWORD: bookings
          POSTGRES_DB: bookings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookings -d bookings"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cp api/.env.example api/.env
      - run: npm test -w api

  # UI runbook scripts: Playwright starts the runbooks upstream server (fixtures
  # replay) and the web dev server itself, so no API or Postgres is needed.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  # Checks that need no database or browser.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test -w web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
